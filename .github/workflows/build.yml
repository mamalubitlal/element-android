name: чатор Android Build

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch: # Allow manual trigger

jobs:
  build:
    name: Build чатор Android
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle
          check-latest: true
          java-package: jdk
      
      - name: Force Java 17 for all Gradle tasks
        run: |
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> $GITHUB_ENV
          echo "JAVA_HOME_11_X64=" >> $GITHUB_ENV
          echo "JAVA_HOME_21_X64=" >> $GITHUB_ENV
      
      - name: Grant execute permission for gradlew
        run: chmod +x gradlew
      
      - name: Fix Gradle JVM args (remove deprecated MaxPermSize)
        run: |
          # Remove deprecated MaxPermSize from gradle.properties if present
          if [ -f gradle.properties ]; then
            sed -i 's/-XX:MaxPermSize=[0-9]*[mM]//g' gradle.properties
            sed -i 's/MaxPermSize=[0-9]*[mM]//g' gradle.properties
          fi
      
      - name: Build Debug APK
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
          GRADLE_OPTS: "-XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC -Xms512M -Xmx4g"
        run: ./gradlew assembleDebug --no-daemon
      
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: chator-android-debug
          path: vector-app/build/outputs/apk/debug/*.apk
          retention-days: 30
      
      - name: Build Release APK (unsigned)
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
          GRADLE_OPTS: "-XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC -Xms512M -Xmx4g"
        run: ./gradlew assembleRelease --no-daemon
      
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: chator-android-release
          path: vector-app/build/outputs/apk/release/*.apk
          retention-days: 30
      
      - name: Build Android App Bundle (AAB)
        env:
          JAVA_HOME: ${{ env.JAVA_HOME_17_X64 }}
          GRADLE_OPTS: "-XX:MaxMetaspaceSize=1g -XX:+HeapDumpOnOutOfMemoryError -XX:+UseParallelGC -Xms512M -Xmx4g"
        run: ./gradlew bundleRelease --no-daemon
      
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: chator-android-bundle
          path: vector-app/build/outputs/bundle/release/*.aab
          retention-days: 30
      
      - name: Build Summary
        run: |
          echo "## 🥞 чатор Android Build Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Artifacts:" >> $GITHUB_STEP_SUMMARY
          echo "- Debug APK: vector-app/build/outputs/apk/debug/" >> $GITHUB_STEP_SUMMARY
          echo "- Release APK: vector-app/build/outputs/apk/release/" >> $GITHUB_STEP_SUMMARY
          echo "- App Bundle: vector-app/build/outputs/bundle/release/" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Download:" >> $GITHUB_STEP_SUMMARY
          echo "Go to the **Actions** tab → Select this run → Download artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Server:** https://chator.k.vu" >> $GITHUB_STEP_SUMMARY
          echo "**Package:** im.chator.android" >> $GITHUB_STEP_SUMMARY
