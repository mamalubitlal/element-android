name: чатор Android Build

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master, develop ]
  workflow_dispatch: # Allow manual trigger

# Use same Gradle settings as Element Android
env:
  GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx3072m -Dfile.encoding=UTF-8 -XX:+HeapDumpOnOutOfMemoryError -XX:MaxMetaspaceSize=1g" -Dkotlin.daemon.jvm.options="-Xmx2560m" -Dkotlin.incremental=false
  CI_GRADLE_ARG_PROPERTIES: --stacktrace -PpreDexEnable=false --max-workers 2 --no-daemon

jobs:
  build:
    name: Build чатор Android
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Use JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
      
      - name: Configure gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      
      - name: Build Debug APK
        run: ./gradlew assembleDebug $CI_GRADLE_ARG_PROPERTIES
      
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: chator-android-debug
          path: vector-app/build/outputs/apk/debug/*.apk
          retention-days: 30
      
      - name: Build Release APK (unsigned)
        run: ./gradlew assembleRelease $CI_GRADLE_ARG_PROPERTIES
      
      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: chator-android-release
          path: vector-app/build/outputs/apk/release/*.apk
          retention-days: 30
      
      - name: Build Android App Bundle (AAB)
        run: ./gradlew bundleRelease $CI_GRADLE_ARG_PROPERTIES
      
      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: chator-android-bundle
          path: vector-app/build/outputs/bundle/release/*.aab
          retention-days: 30
      
      - name: Build Summary
        run: |
          echo "## 🥞 чатор Android Build Complete!" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Build Artifacts:" >> $GITHUB_STEP_SUMMARY
          echo "- Debug APK: vector-app/build/outputs/apk/debug/" >> $GITHUB_STEP_SUMMARY
          echo "- Release APK: vector-app/build/outputs/apk/release/" >> $GITHUB_STEP_SUMMARY
          echo "- App Bundle: vector-app/build/outputs/bundle/release/" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Download:" >> $GITHUB_STEP_SUMMARY
          echo "Go to the **Actions** tab → Select this run → Download artifacts" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Server:** https://chator.k.vu" >> $GITHUB_STEP_SUMMARY
          echo "**Package:** im.chator.android" >> $GITHUB_STEP_SUMMARY
